data:
  historical_results: data/historical_results/results.csv
  groups: data/world_cup_2026/groups.csv
  fixtures: data/world_cup_2026/fixtures.csv
  squads: data/world_cup_2026/squads.csv
  third_place_slots: data/world_cup_2026/third_place_slots.csv
  output_dir: outputs
forecast:
  as_of: "2026-07-01"
  simulations: 50000
  seed: 20260614
fit:
  tune: true
  backtest_years: [2018, 2022]
  # Used directly when tune=false; fallback if tuning has no World Cup backtest matches.
  half_life: 2.5
  # Candidate values tested when tune=true. The selected value replaces half_life during the run.
  half_life_years: [1.5, 2.5, 4.0]
elo:
  # 1500 and 400 are standard Elo scale choices. K values follow World Football Elo-style match weights.
  initial: 1500.0
  divisor: 400.0
  # World Football Elo uses 100 points for home advantage; this model uses a smaller 70-point prior.
  venue_advantage: 70.0
  current_world_cup_k_multiplier: 1.25
  k:
    FIFA World Cup: 60.0
    FIFA World Cup qualification: 40.0
    UEFA Euro: 50.0
    Copa America: 50.0
    AFC Asian Cup: 50.0
    Africa Cup of Nations: 50.0
    CONCACAF Gold Cup: 50.0
    Friendly: 20.0
    default: 30.0
knockout:
  penalty_rating_scale: 500.0
goals:
  score_cap: 8
  # Used directly when tune=false; fallback if tuning has no World Cup backtest matches.
  min_expected_goals: 0.15
  # Candidate values tested when tune=true. The selected value replaces min_expected_goals during the run.
  min_expected_goals_values: [0.05, 0.10, 0.15, 0.20]
form:
  gamma: 0.05
underdog_magic:
  enabled: true
  max_rating_boost: 40.0
  points_residual_for_max_boost: 5.0
  min_rating_gap: 200.0
  rating_gap_for_full_weight: 300.0
cohesion:
  enabled: true
  max_rating_boost: 25.0
  same_club_weight: 1.0
  same_league_weight: 0.25
  score_for_max_boost: 20.0
